<svg xmlns="http://www.w3.org/2000/svg" width="480" height="195" viewBox="0 0 480 195" role="img" aria-label="GitHub streak stats">
  <style>
    .num { font: 700 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    .lbl { font: 400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    .lblb { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    .dt { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; opacity: .85; }
  </style>
  <rect x="0.5" y="0.5" width="479" height="194" rx="14" fill="#F4FAFE" stroke="#B8DCEC"/>
  <line x1="160" y1="28" x2="160" y2="170" stroke="#C9E2F2" stroke-width="1"/>
  <line x1="320" y1="28" x2="320" y2="170" stroke="#C9E2F2" stroke-width="1"/>

  <g text-anchor="middle">
    <text x="80" y="79" class="num" fill="#2F3E4E">224</text>
    <text x="80" y="114" class="lbl" fill="#4A5B6E">Total Contributions</text>
    <text x="80" y="140" class="dt" fill="#4A5B6E">Oct 22, 2025 - Present</text>
  </g>

  <g text-anchor="middle">
    <circle cx="240" cy="71" r="40" fill="none" stroke="#F285B0" stroke-width="5"/>
    <circle cx="240" cy="31" r="15" fill="#F4FAFE"/>
    <g transform="translate(240 30)">
      <path d="M0,-13 C6,-7 10,-2 10,4 C10,10 5.5,14 0,14 C-5.5,14 -10,10 -10,4 C-10,-1 -7,-5 -4.5,-8 C-4,-4 -2,-1.5 0.5,-0.5 C1,-5 0,-9 0,-13 Z" fill="#E58AA8"/>
      <path d="M0,2 C3,5 4,7 4,9 C4,11.5 2,13 0,13 C-2,13 -4,11.5 -4,9 C-4,7 -2,5 0,2 Z" fill="#F4FAFE" opacity=".75"/>
    </g>
    <text x="240" y="81" class="num" fill="#DF4583">28</text>
    <text x="240" y="140" class="lblb" fill="#DF4583">Current Streak</text>
    <text x="240" y="162" class="dt" fill="#4A5B6E">Oct 10 - Nov 6</text>
  </g>

  <g text-anchor="middle">
    <text x="400" y="79" class="num" fill="#2F3E4E">28</text>
    <text x="400" y="114" class="lbl" fill="#4A5B6E">Longest Streak</text>
    <text x="400" y="140" class="dt" fill="#4A5B6E">Oct 10 - Nov 6</text>
  </g>
</svg>
