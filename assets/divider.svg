<svg xmlns="http://www.w3.org/2000/svg" width="820" height="44" viewBox="0 0 820 44" role="img" aria-label="decorative divider">
  <style>
    .float{animation:floaty 3s ease-in-out infinite}
    .tw1{animation:tw 2.4s ease-in-out infinite}
    .tw2{animation:tw 2.4s ease-in-out .8s infinite}
    .tw3{animation:tw 2.4s ease-in-out 1.6s infinite}
    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
  <defs>
    <linearGradient id="lgL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5EAD7" stop-opacity="0"/>
      <stop offset="1" stop-color="#A7D8F0"/>
    </linearGradient>
    <linearGradient id="lgR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F9C9D3"/>
      <stop offset="1" stop-color="#D8C6EC" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="60" y1="22" x2="360" y2="22" stroke="url(#lgL)" stroke-width="2" stroke-linecap="round"/>
  <line x1="460" y1="22" x2="760" y2="22" stroke="url(#lgR)" stroke-width="2" stroke-linecap="round"/>
  <!-- travelling beads -->
  <circle cy="22" r="3.5" fill="#E58AA8">
    <animate attributeName="cx" values="60;360;60" keyTimes="0;.5;1" dur="6s" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" repeatCount="indefinite"/>
  </circle>
  <circle cy="22" r="3.5" fill="#7FCBB0">
    <animate attributeName="cx" values="760;460;760" keyTimes="0;.5;1" dur="6s" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" repeatCount="indefinite"/>
  </circle>
  <!-- centre blossom + sparkles -->
  <g class="float"><text x="410" y="28" text-anchor="middle" font-size="16" fill="#E58AA8">❀</text></g>
  <text class="tw1" x="378" y="27" font-size="12" fill="#A7D8F0">✦</text>
  <text class="tw2" x="436" y="20" font-size="10" fill="#D8C6EC">✦</text>
  <text class="tw3" x="410" y="12" font-size="9" fill="#B5EAD7">✦</text>
</svg>
