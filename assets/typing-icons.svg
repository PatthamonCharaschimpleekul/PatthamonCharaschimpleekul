<svg xmlns="http://www.w3.org/2000/svg" width="820" height="190" viewBox="0 0 820 190" role="img" aria-label="My daily tools typing in: Python, C plus plus, JavaScript, HTML5, Jupyter">
  <style>
    .head{font:600 15px 'Segoe UI',sans-serif;fill:#3D4A5C;letter-spacing:.14em}
    .sub{font:400 14px 'Segoe UI',sans-serif;fill:#5B6B7F}
    .lbl{font:700 26px 'Segoe UI',Consolas,monospace;text-anchor:middle}
    .cap{transform-box:fill-box;transform-origin:50% 60%;animation:8s ease infinite both}
    .caret{fill:#E58AA8;animation:caretMove 8s steps(4,end) infinite, blink 1s steps(2,start) infinite}
    @keyframes a0{0%,2%{opacity:0;transform:translateY(18px) scale(.5)}6%,72%{opacity:1;transform:none}76%,100%{opacity:0;transform:translateY(-10px) scale(.9)}}
    @keyframes a1{0%,10%{opacity:0;transform:translateY(18px) scale(.5)}14%,74%{opacity:1;transform:none}78%,100%{opacity:0;transform:translateY(-10px) scale(.9)}}
    @keyframes a2{0%,18%{opacity:0;transform:translateY(18px) scale(.5)}22%,76%{opacity:1;transform:none}80%,100%{opacity:0;transform:translateY(-10px) scale(.9)}}
    @keyframes a3{0%,26%{opacity:0;transform:translateY(18px) scale(.5)}30%,78%{opacity:1;transform:none}82%,100%{opacity:0;transform:translateY(-10px) scale(.9)}}
    @keyframes a4{0%,34%{opacity:0;transform:translateY(18px) scale(.5)}38%,80%{opacity:1;transform:none}84%,100%{opacity:0;transform:translateY(-10px) scale(.9)}}
    @keyframes caretMove{0%{transform:translateX(0)}40%{transform:translateX(576px)}100%{transform:translateX(576px)}}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect width="820" height="190" rx="18" fill="#FBF9FC"/>
  <text class="head" x="410" y="34" text-anchor="middle">M Y   T O O L K I T ,   T Y P I N G</text>
  <!-- keycaps: x = 134 + 144*i ; shadow y=90, top y=80, text baseline 132 -->
  <g class="cap" style="animation-name:a0">
    <rect x="134" y="90" width="80" height="76" rx="16" fill="#7FB3D3"/>
    <rect x="134" y="80" width="80" height="76" rx="16" fill="#A7D8F0"/>
    <text class="lbl" x="174" y="129" fill="#2F5D7C">Py</text>
  </g>
  <g class="cap" style="animation-name:a1">
    <rect x="278" y="90" width="80" height="76" rx="16" fill="#B49DD3"/>
    <rect x="278" y="80" width="80" height="76" rx="16" fill="#D8C6EC"/>
    <text class="lbl" x="318" y="129" fill="#5A4478">C++</text>
  </g>
  <g class="cap" style="animation-name:a2">
    <rect x="422" y="90" width="80" height="76" rx="16" fill="#E0B98F"/>
    <rect x="422" y="80" width="80" height="76" rx="16" fill="#FDDCAD"/>
    <text class="lbl" x="462" y="129" fill="#7A5A1F">JS</text>
  </g>
  <g class="cap" style="animation-name:a3">
    <rect x="566" y="90" width="80" height="76" rx="16" fill="#E0A87F"/>
    <rect x="566" y="80" width="80" height="76" rx="16" fill="#FCC9A7"/>
    <text class="lbl" x="606" y="129" fill="#8F4E1F">&lt;/&gt;</text>
  </g>
  <g class="cap" style="animation-name:a4">
    <rect x="710" y="90" width="80" height="76" rx="16" fill="#C2B8CE"/>
    <rect x="710" y="80" width="80" height="76" rx="16" fill="#E4DEF0"/>
    <text class="lbl" x="750" y="129" fill="#75687F">Jp</text>
  </g>
  <rect class="caret" x="214" y="82" width="6" height="72" rx="3"/>
  <text class="sub" x="410" y="178" text-anchor="middle">Python · C++ · JavaScript · HTML5 · Jupyter</text>
</svg>
