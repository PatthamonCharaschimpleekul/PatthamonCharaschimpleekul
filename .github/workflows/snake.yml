name: 🐍 Generate snake animation

on:
  schedule:
    - cron: '0 17 * * *'          # ~daily (17:00 UTC ≈ midnight Bangkok)
  workflow_dispatch:              # manual "Run workflow" button
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'assets/snake.gif'   # ignore the workflow's own auto-commits — prevents a trigger loop

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.gif?width=480&color_snake=%232F3E4E&color_background=%23EAF4FB&color_dot_border=%23FFFFFF&color_dots=%23C9E2F2%2C%23F7C6D8%2C%23F285B0%2C%23DF4583%2C%23A9165E

      - name: Commit updated snake.gif
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: regenerate snake 🐍'
          file_pattern: assets/snake.gif
